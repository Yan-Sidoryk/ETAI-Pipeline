# Adult income (UCI Adult, 1994 census): does this person earn > 50K a year?
# Run with: python main.py
data:
  path: "data/adult_train.csv"
  predict_path: "data/adult_new.csv"               # label-free rows predicted by the final refit model
  target: "income_over_50k"
  sensitive_attr: "sex"                             # never a feature; used only for the fairness report
  # fnlwgt: census sampling weight, not a trait of the person. race: second protected attribute,
  # kept out of the model too (not needed to predict income, and would let the model use it).
  drop_columns: ["id", "fnlwgt", "race"]

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2",
            "roc_auc", "average_precision"]
  selection_metric: "roc_auc"
  n_jobs: -1

diagnostics:
  id_column: "id"
  numeric_text_columns: []                          # empty cells in v01-v06 are already read as NaN
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]   # "?" in workclass/occupation/native_country
  validity_rules:                                   # Adult's own rules: 17-year-olds are valid here
    age: {min: 17, max: 90}
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0}                          # 99999 is the census top code: a real value, not missing
    capital_loss: {min: 0}
  canonical_categories: {}
  redundant_columns: ["education"]                  # one-to-one with education_num, which keeps the order

preprocessing:
  encoder: "target"                                # onehot | ordinal | count | target (target best on the scoreboard)
  scaler: "robust"
  feature_engineering: "adult"
  numeric_features: ["age", "education_num", "capital_gain", "capital_loss", "hours_per_week",
                     "v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09",
                     "v10", "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18",
                     # engineered in add_adult_features
                     "log_capital_gain", "log_capital_loss", "has_capital_gain", "has_capital_loss", "capital_net"]
  categorical_features: ["workclass", "marital_status", "occupation", "relationship", "native_country",
                         "v19", "v20", "v21", "v22", "v23", "v24", "v25"]
  # workclass and occupation are missing for the same people (they earn > 50K half as often): one flag.
  mnar_indicator_sources: ["workclass"]
  random_state: 42                                  # target encoder's folds and the model-based imputers
  imputation:
    numeric_strategy: "median"                      # median | mean | knn | iterative | random_forest
    categorical_strategy: "most_frequent"
    n_neighbors: 5                                  # knn
    max_iter: 10                                    # iterative, random_forest
    n_estimators: 50                                # random_forest (trees per column)

model:
  type: "gradient_boosting"  # dummy | logistic_regression | naive_bayes | decision_tree | random_forest | oblique_random_forest | adaboost | gradient_boosting | hist_gradient_boosting | xgboost
  params:
    {random_state: 42}
  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # (GradientBoostingClassifier and GaussianNB have no class_weight; XGBoost's equivalent is
  # scale_pos_weight = negatives / positives, about 3.2 here -- raises F1, lowers accuracy).
  # logistic_regression:    {max_iter: 2000, class_weight: balanced}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42, class_weight: balanced}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # gradient_boosting:      {random_state: 42}
  # hist_gradient_boosting: {random_state: 42, class_weight: balanced}
  # xgboost:                {n_estimators: 300, learning_rate: 0.05, max_depth: 4, random_state: 42, n_jobs: -1}

feature_selection:
  enabled: true
  min_votes: 2
  random_state: 42
  search_space:
    select__min_votes: {type: int, low: 1, high: 3}

tuning:
  enabled: true
  n_trials: 30
  n_splits: 5
  random_state: 42
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000000001, high: 0.1, log: true}
    # xgboost:
    #   model__n_estimators: {type: int, low: 50, high: 600, log: true}
    #   model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
    #   model__max_depth: {type: int, low: 1, high: 8}
    #   model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
    #   model__subsample: {type: float, low: 0.5, high: 1.0}
    #   model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
    #   model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
    #   model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
    #   model__gamma: {type: float, low: 0.0, high: 5.0}

output:
  results_dir: "results"
  model_path: "models/model.joblib"                 # the final fitted pipeline, used by predict.py (overwritten each run)
  scoreboard: "results/runs.csv"                    # one row per run; delete it when the data, cleaning or folds change
  predictions: "predictions/adult_new_predictions.csv"   # outside results/ (gitignored) so it is committed
